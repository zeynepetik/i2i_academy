services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=cryptopal'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=postgres'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'

  redis:
    image: 'redis:7'
    ports:
      - '127.0.0.1:6379:6379'

  backend:
    build:
      context: ./CryptoPal Core/Backend/cryptopal
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cryptopal'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}'
      - 'SPRING_DATA_REDIS_HOST=redis'
      - 'SPRING_DATA_REDIS_PORT=6379'
      - 'GEMINI_API_KEY=${GEMINI_API_KEY}'
      - 'GEMINI_MODEL=gemini-3.6-flash'
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./CryptoPal Web App
      dockerfile: Dockerfile
      args:
        - 'NEXT_PUBLIC_API_BASE_URL=http://13.221.34.243:8080'
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
#postgres_data adında volume oluşturuldu yukarıda bilgine
  postgres_data: