#one shared network named voltwise
name: voltwise

services: 
  postgres:
    image: postgres:17
    container_name: voltwise_postgres
    environment:
      - 'POSTGRES_DB=voltwise'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.7.1
    container_name: voltwise_kafka
    ports:
      - "${KAFKA_HOST_PORT}:29092"
    environment: 
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - voltwise_net
      
  ignite:
    image: apacheignite/ignite:2.16.0
    container_name: voltwise_ignite
    environment: 
      IGNITE_QUIET: "false"
      JVM_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${IGNITE_CLIENT_PORT}:10800" # thin client protocol
      - "${IGNITE_REST_PORT}:8080"    # REST API
      - "47100:47100"                 # node communication
      - "47500:47500"                 # node discovery
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ignite?cmd=version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - voltwise_net

networks:
  voltwise_net:
    name: voltwise_net

volumes:
  postgres_data:
    